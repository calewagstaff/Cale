# Buckeye Home: Home Assistant dashboard
# Needs card-mod (HACS -> Frontend -> card-mod) for the custom:mod-card styling.
# Replace the example entity IDs (light.kitchen, climate.thermostat, ...) with your own.
title: Buckeye Home
views:
- title: Home
  path: home
  icon: mdi:home-outline
  type: panel
  background: 'linear-gradient(160deg, #121315, #08090a) fixed'
  cards:
  - type: custom:mod-card
    card_mod:
      style:
        .: |
          ha-card {
            background: none;
            border: none;
            box-shadow: none;
            max-width: 1400px;
            margin: 0 auto;
            padding: 12px 4px 48px;
            --scarlet: #bb0000;
            --red-color: #d0161f;
            --ha-card-background: rgba(255, 255, 255, 0.045);
            --ha-card-border-color: rgba(255, 255, 255, 0.07);
            --ha-card-border-width: 1px;
            --ha-card-border-radius: 18px;
            --ha-card-box-shadow: none;
            --primary-text-color: #f1f2f4;
            --secondary-text-color: #9a9fa6;
            --primary-color: #bb0000;
            --accent-color: #bb0000;
            --state-icon-color: #a7adb4;
            --divider-color: rgba(255, 255, 255, 0.08);
          }
        hui-vertical-stack-card$: |
          #root {
            display: grid !important;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr));
            gap: 20px;
            align-items: start;
          }
          #root > * { margin: 0 !important; }
          #root > :first-child { grid-column: 1 / -1; }
    card:
      type: vertical-stack
      cards:
      - type: markdown
        text_only: true
        content: |
          # {% if now().hour < 12 %}Good morning{% elif now().hour < 18 %}Good afternoon{% else %}Good evening{% endif %}
          {{ now().strftime('%A, %B %-d') }} · {{ state_attr('weather.forecast_home', 'temperature') }}{{ state_attr('weather.forecast_home', 'temperature_unit') }} and {{ states('weather.forecast_home') | replace('-', ' ') | replace('partlycloudy', 'partly cloudy') }}
        card_mod:
          style: |
            ha-card { padding: 4px 8px 0; color: #9a9fa6; font-size: 15px; }
      - type: vertical-stack
        cards:
        - type: heading
          heading: Right now
          icon: mdi:weather-partly-cloudy
          badges:
          - type: entity
            entity: person.cale
            show_name: true
            show_state: true
            show_icon: true
          - type: entity
            entity: person.partner
            show_name: true
            show_state: true
            show_icon: true
        - type: weather-forecast
          entity: weather.forecast_home
          show_current: true
          show_forecast: true
          forecast_type: daily
        - type: grid
          columns: 2
          square: false
          cards:
          - type: tile
            entity: script.good_morning
            name: Good morning
            icon: mdi:weather-sunny
            color: amber
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.good_morning
          - type: tile
            entity: script.good_night
            name: Good night
            icon: mdi:weather-night
            color: red
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.good_night
              confirmation:
                text: Turn off all lights and lock up?
      - type: vertical-stack
        cards:
        - type: heading
          heading: Lights
          icon: mdi:lightbulb-outline
          tap_action:
            action: navigate
            navigation_path: /dashboard-home/lights
          badges:
          - type: entity
            entity: sensor.lights_on_count
            show_state: true
            show_icon: true
        - type: tile
          entity: light.all_lights
          name: All lights
          features:
          - type: light-brightness
          features_position: bottom
        - type: grid
          columns: 2
          square: false
          cards:
          - type: tile
            entity: light.living_room
            name: Living room
            features:
            - type: light-brightness
            features_position: bottom
          - type: tile
            entity: light.kitchen
            name: Kitchen
            features:
            - type: light-brightness
            features_position: bottom
          - type: tile
            entity: light.bedroom
            name: Bedroom
          - type: tile
            entity: light.porch
            name: Porch
          - type: tile
            entity: switch.coffee_maker
            name: Coffee maker
            icon: mdi:coffee-maker
            color: red
      - type: vertical-stack
        cards:
        - type: heading
          heading: Climate
          icon: mdi:thermostat
          tap_action:
            action: navigate
            navigation_path: /dashboard-home/climate
        - type: thermostat
          entity: climate.thermostat
          features:
          - type: climate-hvac-modes
            hvac_modes:
            - heat
            - cool
            - heat_cool
            - 'off'
        - type: grid
          columns: 2
          square: false
          cards:
          - type: tile
            entity: sensor.indoor_temperature
            name: Inside
          - type: tile
            entity: sensor.indoor_humidity
            name: Humidity
      - type: vertical-stack
        cards:
        - type: heading
          heading: Security
          icon: mdi:shield-home-outline
          tap_action:
            action: navigate
            navigation_path: /dashboard-home/security
        - type: tile
          entity: lock.front_door
          name: Front door
          color: red
          features:
          - type: lock-commands
          features_position: inline
        - type: tile
          entity: cover.garage_door
          name: Garage
          features:
          - type: cover-open-close
          features_position: inline
        - type: tile
          entity: alarm_control_panel.home_alarm
          name: Alarm
          features:
          - type: alarm-modes
            modes:
            - armed_home
            - armed_away
            - disarmed
        - type: grid
          columns: 2
          square: false
          cards:
          - type: tile
            entity: binary_sensor.front_door
            name: Front door
          - type: tile
            entity: binary_sensor.back_door
            name: Back door
