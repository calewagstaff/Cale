# ─────────────────────────────────────────────────────────────
#  Optional helpers used by the dashboard.
#  Paste the matching parts into configuration.yaml / scripts.yaml,
#  or build the same thing in Settings → Automations & Scenes → Scripts.
# ─────────────────────────────────────────────────────────────

# ── configuration.yaml ──────────────────────────────────────
# "How many lights are on" number, shown as a badge on the Lights heading.
template:
  - sensor:
      - name: Lights on count
        unique_id: lights_on_count
        icon: mdi:lightbulb-on
        state: >
          {{ states.light | selectattr('state', 'eq', 'on')
             | rejectattr('attributes.entity_id', 'defined')
             | list | count }}

# One "All lights" switch for the Home screen.
# List your real lights here.
light:
  - platform: group
    name: All lights
    unique_id: all_lights
    entities:
      - light.living_room
      - light.kitchen
      - light.bedroom
      - light.porch

# ── scripts.yaml ────────────────────────────────────────────
# (In scripts.yaml, leave off the top-level "script:" line.)
script:
  good_morning:
    alias: Good morning
    icon: mdi:weather-sunny
    sequence:
      - action: light.turn_on
        target:
          entity_id:
            - light.kitchen
            - light.living_room
        data:
          brightness_pct: 80
      - action: switch.turn_on
        target:
          entity_id: switch.coffee_maker
      - action: lock.unlock
        target:
          entity_id: lock.front_door

  good_night:
    alias: Good night
    icon: mdi:weather-night
    sequence:
      - action: light.turn_off
        target:
          entity_id: all
      - action: lock.lock
        target:
          entity_id: all
      - action: cover.close_cover
        target:
          entity_id: cover.garage_door
      - action: alarm_control_panel.alarm_arm_home
        target:
          entity_id: alarm_control_panel.home_alarm
